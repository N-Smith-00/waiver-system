<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiver</title>
    
</head>
<body>

<h2>Adult Waiver</h2>

<form id="waiverForm">
    <h3>Participant Info</h3>

    <label for="fname">First Name</label>
    <input
        id="fname"
        type="text"
        name="first_name"
        required
    >

    <label for="lname">Last Name</label>
    <input
        id="lname"
        type="text"
        name="last_name"
        required
    >

    <label for="email">Email</label>
    <input
        id="email"
        type="email"
        name="email"
        placeholder="you@example.com"
        required
    >

    <label for="dob">Date of Birth</label>
    <input 
        id="dob"
        type="date"
        name="dob"
        required
    >

    <label for="phone-num">Phone Number</label>
    <input 
        id="phone-num"
        type="tel"
        name="phone_num"
        required
    >

    <h3>Emergency Contact</h3>

    <label for="ec-fname">First Name</label>
    <input
        id="ec-fname" 
        type="text"
        name="ec_fname"
        required
    >

    <label for="ec-lname">Last Name</label>
    <input
        id="ec-lname"
        type="text" 
        name="ec_lname" 
    >

    <label for="ec-phone-num">Emergency Contact's Phone Number</label>
    <input 
        id="ec-phone-num"
        type="tel"
        name="ec_phone_num"
    >

    <h3>Electronic Signature Consent</h3>
    <label class="checkbox-label">
        <input 
            id="sig-consent"
            class="checkbox"
            type="checkbox"
            name="sig_consent"
            value="true"
            required
        >
        <span>By checking here, you aggree to the use of your electronic signature in lieu of an original signature on paper.</span>
    </label>

    <button type="submit">Submit</button>
</form>

<p id="status" class="status"></p>
<p id="error"></p>

<script>
const form = document.getElementById("waiverForm");
const status = document.getElementById("status");
const error = document.getElementById("error");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    data = Object.fromEntries(new FormData(form));

    console.log("Submitting:", data);

    const response = await fetch("https://nicholassmith.dev/baseline-waiver-test/submit", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    const result = await response.json();
    console.log(result);

    if (result["success"]) {
        status.textContent = "Form captured successfully!";
        error.textContent = "";
        status.classList.add("success");
        status.classList.remove("error");
    } else {
        status.textContent = "Error with submission";
        error.textContent = result["error"]
        status.classList.add("error");
        status.classList.remove("success");
    }
});
</script>

</body>
</html>
