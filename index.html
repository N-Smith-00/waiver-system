<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiver Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #status {
            margin-top: 15px;
            color: green;
        }
    </style>
</head>
<body>

<h2>Waiver Test Form</h2>

<form id="waiverForm">
    <input
        type="text"
        name="name"
        placeholder="Full Name"
        required
    >

    <input
        type="email"
        name="email"
        placeholder="Email Address"
        required
    >

    <button type="submit">Submit</button>
</form>

<p id="status"></p>

<script>
const form = document.getElementById("waiverForm");
const status = document.getElementById("status");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = Object.fromEntries(new FormData(form));

    console.log("Submitting:", data);

    // Uncomment this once your server is running

    const response = await fetch("https://nicholassmith.dev/baseline-waiver-test/submit", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    const result = await response.json();
    console.log(result);

    status.textContent = "Form captured successfully!";
});
</script>

</body>
</html>
